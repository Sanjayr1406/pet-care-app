<!DOCTYPE html>
<html>
<head>
    <title>Nearby Services</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h2>Nearby Pet Services</h2>

    <div class="btn-group">
        <button onclick="openVets()">Veterinary Clinics</button>
        <button onclick="openGrooming()">Pet Grooming Centers</button>
        <button class="secondary" onclick="goBack()">Back to Dashboard</button>
    </div>
</div>

<script>
function openVets() {
    window.open("https://www.google.com/maps/search/veterinary+clinic+near+me", "_blank");
}

function openGrooming() {
    window.open("https://www.google.com/maps/search/pet+grooming+near+me", "_blank");
}

function goBack() {
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
