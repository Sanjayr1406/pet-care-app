<!DOCTYPE html>
<html>
<head>
    <title>Boarding Request</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h2>Temporary Boarding</h2>

    <form id="boardingForm">
        <input type="number" id="pet_id" placeholder="Pet ID" required>
        <input type="date" id="start" required>
        <input type="date" id="end" required>
        <button type="submit">Request Boarding</button>
    </form>

    <p id="response"></p>

    <button class="secondary" onclick="goBack()">Back to Dashboard</button>
</div>

<script>
document.getElementById("boardingForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const data = {
        user_id: localStorage.getItem("user_id"),
        pet_id: document.getElementById("pet_id").value,
        start_date: document.getElementById("start").value,
        end_date: document.getElementById("end").value
    };

    fetch("http://127.0.0.1:5000/boarding-request", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
        document.getElementById("response").innerText = result.message;
    });
});

function goBack() {
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
