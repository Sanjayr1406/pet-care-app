<!DOCTYPE html>
<html>
<head>
    <title>Add Reminder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h2>Add Vaccination Reminder</h2>

    <form id="reminderForm">
        <input type="number" id="pet_id" placeholder="Pet ID" required>
        <input type="text" id="vaccine" placeholder="Vaccine Name" required>
        <input type="date" id="date" required>
        <button type="submit">Add Reminder</button>
    </form>

    <p id="response"></p>

    <button class="secondary" onclick="goBack()">Back to Dashboard</button>
</div>

<script>
document.getElementById("reminderForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const data = {
        pet_id: document.getElementById("pet_id").value,
        vaccine_name: document.getElementById("vaccine").value,
        due_date: document.getElementById("date").value
    };

    fetch("http://127.0.0.1:5000/add-reminder", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
        document.getElementById("response").innerText = result.message;
    });
});

function goBack() {
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
